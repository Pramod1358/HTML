<!-- list in html means a collection of items which can be ordered or unordered. There are three types of lists in html which are as follows:
1. Ordered List
2. Unordered List
3. Description List
 -->


<!-- unordered list is a list of items in which the order of the items does not matter. 
It is created using the <ul> tag, and each item in the list is represented by the <li> tag. 
The items are usually displayed with bullet points. li * 3 means instantiate three list items and press tab to go through them  -->


<ul>
    <li>english</li>
    <li>Maths</li>
    <li>Science</li>
</ul>

<!-- ordered list is a list of items in which the order of the items matters. 
it is created using the <ol> tag, and each item in the list is represented by the <li> tag. 
we can also specify the starting number for the list items  and also we can specify the type of numbering
we can also write them in reverse  -->


<ol start="5" type="A">
    <li>english</li>
    <li>Maths</li>
    <li>science</li>
</ol>

<h6>Description List</h6>

<!-- description list is a list of items in which each item has a term and a description.
it is created using the <dl> tag, and each term is represented by the <dt
> tag, and each description is represented by the <dd> tag. -->

<dl>
    <dt>HTML</dt>
    <dd>Hypertext Markup Language</dd>
    <dt>CSS</dt>
    <dd>Cascading Style Sheets</dd>
    <dt>JS</dt>
    <dd>JavaScript</dd>
</dl>
